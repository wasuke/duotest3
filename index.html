(()=>{'use strict';const $=id=>document.getElementById(id),fmt=v=>typeof v==='number'?Number(v.toFixed(3)):v==null?'—':String(v),mm=q=>{try{return matchMedia(q).matches}catch{return false}},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let logs=[],previous={},orientation=null,motion=null,permission='未要求',current=null;function rows(id,arr){$(id).innerHTML=arr.map(([k,v,cls])=>`<div class="key">${esc(k)}</div><div class="value ${cls||''}">${esc(fmt(v))}</div>`).join('')}function log(msg){logs.unshift(new Date().toLocaleTimeString('ja-JP',{hour12:false})+' '+msg);logs=logs.slice(0,250);$('logText').textContent=logs.join('\n')}function changed(k,v){let s=JSON.stringify(v);if(previous[k]!==s){if(k in previous)log(k+' '+s);previous[k]=s}}function measure(){const nx=mm('(horizontal-viewport-segments: 2)')?2:1,ny=mm('(vertical-viewport-segments: 2)')?2:1,probe=document.createElement('div'),fallback=-98765;probe.className='probe';probe.style.cssText='left:0!important;top:0!important;width:0!important;height:0!important;';document.body.appendChild(probe);const seg=[];for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let r={x,y},valid=true;for(let f of ['left','top','width','height']){probe.style.setProperty(f,`env(viewport-segment-${f} ${x} ${y}, ${fallback}px)`,'important');const css=getComputedStyle(probe).getPropertyValue(f).trim(),rect=probe.getBoundingClientRect(),rv=f==='left'?rect.left:f==='top'?rect.top:f==='width'?rect.width:rect.height,n=parseFloat(css);r[f]=Number.isFinite(n)&&n!==fallback?n:null;r[f+'Rect']=rv;r[f+'CSS']=css;valid&&=r[f]!==null;probe.style.setProperty(f,'0px','important')}if(valid)seg.push(r)}probe.remove();const b=seg.length?{left:Math.min(...seg.map(s=>s.left)),top:Math.min(...seg.map(s=>s.top)),right:Math.max(...seg.map(s=>s.left+s.width)),bottom:Math.max(...seg.map(s=>s.top+s.height))}:null;const extent=b?{width:b.right-b.left,height:b.bottom-b.top}:null;const sx=extent?.width?innerWidth/extent.width:null,sy=extent?.height?innerHeight/extent.height:null;const consistent=sx!==null&&sy!==null&&Math.abs(sx-1)<.03&&Math.abs(sy-1)<.03;return{nx,ny,seg,extent,sx,sy,consistent,b}}function draw(m){const el=$('diagram');el.replaceChildren();const w=innerWidth,h=innerHeight,sc=Math.min((el.clientWidth-10)/w,105/h),ox=(el.clientWidth-w*sc)/2,oy=(115-h*sc)/2;for(let i=0;i<m.seg.length;i++){const s=m.seg[i],d=document.createElement('div');d.className='seg';d.style.left=(ox+(s.left-m.b.left)*(m.sx||1)*sc)+'px';d.style.top=(oy+(s.top-m.b.top)*(m.sy||1)*sc)+'px';d.style.width=(s.width*(m.sx||1)*sc)+'px';d.style.height=(s.height*(m.sy||1)*sc)+'px';d.textContent='領域'+(i+1);el.appendChild(d)}}function tick(){const m=measure(),vp=visualViewport,doc=document.documentElement,body=document.body,ptype=navigator.devicePosture?.type??'非対応';current={time:new Date().toISOString(),posture:ptype,orientation:screen.orientation?.type,angle:screen.orientation?.angle,viewport:{innerWidth,innerHeight,visualWidth:vp?.width,visualHeight:vp?.height,visualOffsetTop:vp?.offsetTop,scrollY,docClientHeight:doc.clientHeight,docScrollHeight:doc.scrollHeight,bodyScrollHeight:body.scrollHeight,appHeight:$('app').getBoundingClientRect().height},segments:m,deviceOrientation:orientation,deviceMotion:motion,userAgent:navigator.userAgent};rows('summary',[['Device Posture',ptype,ptype==='folded'?'good':''],['CSS folded',String(mm('(device-posture: folded)'))],['画面方向',screen.orientation?.type??'—'],['水平/垂直2分割',`${m.nx===2?'YES':'NO'} / ${m.ny===2?'YES':'NO'}`]]);rows('sizes',[['innerWidth × innerHeight',`${innerWidth} × ${innerHeight}`],['visualViewport',`${fmt(vp?.width)} × ${fmt(vp?.height)}`],['document client / scrollHeight',`${doc.clientHeight} / ${doc.scrollHeight}`],['body scrollHeight',body.scrollHeight],['scrollY / visual offsetTop',`${fmt(scrollY)} / ${fmt(vp?.offsetTop)}`],['app 高さ',fmt($('app').getBoundingClientRect().height)]]);const sr=[['検出領域',m.seg.length],['生値の全体範囲',m.extent?`${fmt(m.extent.width)} × ${fmt(m.extent.height)}`:'—'],['viewportとの一致',m.consistent?'一致':'不一致',m.consistent?'good':'warn'],['横/縦倍率（参考）',`${fmt(m.sx)} / ${fmt(m.sy)}`]];m.seg.forEach((s,i)=>{sr.push([`領域${i+1} left / top`,`${fmt(s.left)} / ${fmt(s.top)}`],[`領域${i+1} width / height`,`${fmt(s.width)} / ${fmt(s.height)}`],[`領域${i+1} CSS vs rect`,`L ${fmt(s.left)}:${fmt(s.leftRect)} T ${fmt(s.top)}:${fmt(s.topRect)} W ${fmt(s.width)}:${fmt(s.widthRect)} H ${fmt(s.height)}:${fmt(s.heightRect)}`])});rows('segments',sr);draw(m);rows('display',[['inner / outer',`${innerWidth}×${innerHeight} / ${outerWidth}×${outerHeight}`],['screen.width × height',`${screen.width} × ${screen.height}`],['devicePixelRatio',devicePixelRatio],['orientation.angle',screen.orientation?.angle],['window.orientation',window.orientation],['visualViewport scale',vp?.scale]]);rows('sensors',[['許可',permission],['alpha / beta / gamma',orientation?[orientation.alpha,orientation.beta,orientation.gamma].map(fmt).join(' / '):'—'],['加速度 X/Y/Z',motion?.a?.map(fmt).join(' / ')??'—'],['重力込み X/Y/Z',motion?.g?.map(fmt).join(' / ')??'—']]);rows('apis',[['Device Posture API',String(!!navigator.devicePosture)],['Viewport Segments',`${m.nx} × ${m.ny}`],['Screen Details API',String(!!window.getScreenDetails)],['内外画面識別','非公開'],['ヒンジ角度','非公開'],['Secure context',String(isSecureContext)]]);$('status').textContent=new Date().toLocaleTimeString('ja-JP')+' LIVE';changed('posture',ptype);changed('viewport',[innerWidth,innerHeight,doc.scrollHeight,scrollY]);changed('segments',m.seg.map(s=>[s.left,s.top,s.width,s.height]));changed('orientation',screen.orientation?.type)}function save(content,name){const blob=new Blob([content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+b.dataset.tab));tick()}));$('permission').onclick=async()=>{try{let a=[];if(typeof DeviceOrientationEvent?.requestPermission==='function')a.push('姿勢 '+await DeviceOrientationEvent.requestPermission());if(typeof DeviceMotionEvent?.requestPermission==='function')a.push('加速度 '+await DeviceMotionEvent.requestPermission());permission=a.join(' / ')||'許可要求不要';log('センサー '+permission)}catch(e){permission='エラー '+e.message;log(permission)}tick()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(current,null,2));log('JSONをコピー')}catch(e){save(JSON.stringify(current,null,2),'duo-v1.3-snapshot.json')}};$('save').onclick=()=>save(JSON.stringify(current,null,2)+'\n\n--- LOG ---\n'+logs.join('\n'),'duo-v1.3-log.txt');$('reset').onclick=()=>{logs=[];log('ログ消去')};window.addEventListener('deviceorientation',e=>{orientation={alpha:e.alpha,beta:e.beta,gamma:e.gamma}},{passive:true});window.addEventListener('devicemotion',e=>{const v=o=>o?[o.x,o.y,o.z]:null;motion={a:v(e.acceleration),g:v(e.accelerationIncludingGravity)}},{passive:true});['resize','orientationchange'].forEach(ev=>window.addEventListener(ev,()=>{log('event '+ev);tick()}));visualViewport?.addEventListener('resize',()=>{log('event visualViewport.resize');tick()});navigator.devicePosture?.addEventListener('change',()=>{log('event devicePosture.change');tick()});document.addEventListener('touchmove',e=>{if(!e.target.closest('.scrollbox'))e.preventDefault()},{passive:false});log('v1.3 固定画面計測開始');tick();setInterval(tick,900)})();
